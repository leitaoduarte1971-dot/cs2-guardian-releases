name: Publish v18.9.1 once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v18.9.1-once.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify private-source token is available
        env:
          SOURCE_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SOURCE_TOKEN:-}" ]; then
            echo "::error::RELEASES_TOKEN is not configured in the public releases repository."
            exit 1
          fi

      - name: Download already validated Windows artifact
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          SOURCE_REPO: leitaoduarte1971-dot/cs2-guardian
          ARTIFACT_ID: "10171234691"
        run: |
          set -euo pipefail
          mkdir -p artifact publish
          gh api -H "Accept: application/vnd.github+json" \
            "repos/${SOURCE_REPO}/actions/artifacts/${ARTIFACT_ID}/zip" > artifact.zip
          unzip -q artifact.zip -d artifact

          manifest="$(find artifact -type f -name update.json -print -quit)"
          package="$(find artifact -type f -name 'cs2-guardian-v18.9.1-win64.zip' -print -quit)"
          installer="$(find artifact -type f -name 'CS2-Guardian-Setup.exe' -print -quit)"
          test -n "$manifest" && test -f "$manifest"
          test -n "$package" && test -f "$package"
          test -n "$installer" && test -f "$installer"

          version="$(jq -r '.version' "$manifest")"
          test "$version" = "v18.9.1"
          expected_sha="$(jq -r '.sha256' "$manifest")"
          actual_sha="$(sha256sum "$package" | awk '{print $1}')"
          test "$expected_sha" = "$actual_sha"
          expected_size="$(jq -r '.size' "$manifest")"
          actual_size="$(stat -c%s "$package")"
          test "$expected_size" = "$actual_size"

          cp "$manifest" publish/update.json
          cp "$package" publish/
          cp "$installer" publish/
          echo "Validated v18.9.1 artifact: $actual_sha ($actual_size bytes)"

      - name: Publish public release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$(jq -r '.notes' publish/update.json)"
          if gh release view v18.9.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Public release v18.9.1 already exists; replacing assets."
          else
            gh release create v18.9.1 --repo "$GITHUB_REPOSITORY" \
              --title "CS2 Guardian v18.9.1" --notes "$notes"
          fi
          gh release upload v18.9.1 --repo "$GITHUB_REPOSITORY" --clobber \
            publish/CS2-Guardian-Setup.exe \
            publish/cs2-guardian-v18.9.1-win64.zip \
            publish/update.json

      - name: Publish update manifest only after assets exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          content="$(base64 -w0 publish/update.json)"
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/update.json" --jq .sha)"
          jq -n \
            --arg message "Update manifest v18.9.1" \
            --arg content "$content" \
            --arg sha "$current_sha" \
            '{message:$message,content:$content,sha:$sha,branch:"main"}' \
            | gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/update.json" --input - >/dev/null

      - name: Create matching source tag and release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          SOURCE_REPO: leitaoduarte1971-dot/cs2-guardian
          TARGET_SHA: 7c8d457db3301e4912ffa0e4c80561ed245ead24
        run: |
          set -euo pipefail
          if ! gh api "repos/${SOURCE_REPO}/git/ref/tags/v18.9.1" >/dev/null 2>&1; then
            gh api --method POST "repos/${SOURCE_REPO}/git/refs" \
              -f ref='refs/tags/v18.9.1' -f sha="$TARGET_SHA" >/dev/null
          fi
          notes="$(jq -r '.notes' publish/update.json)"
          if ! gh release view v18.9.1 --repo "$SOURCE_REPO" >/dev/null 2>&1; then
            gh release create v18.9.1 --repo "$SOURCE_REPO" --target "$TARGET_SHA" \
              --title "CS2 Guardian v18.9.1" --notes "$notes"
          fi
          gh release upload v18.9.1 --repo "$SOURCE_REPO" --clobber \
            publish/CS2-Guardian-Setup.exe \
            publish/update.json
